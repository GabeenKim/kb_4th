<!DOCTYPE html>
<html>
<head>
<title>Insert title here</title>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class= "container">
	<div class="jumbotron text-center">
		<h2>login form</h2>
	</div>
	
	<!-- 
		form 태그에서 메소드 요청 방식은 2가지 존재.  
		1) get : (get it의 준말) 
		         단순한 페이지 연결이 주 목적(데이터 전달이 주된 목적이 아니다. )
				 페이지로 연결할 때 페이지 번호 등 주요 데이터가 아닌 부차적인 데이터는 쿼리스트링 형태로 주소창으로 전달. 
				 따라서 데이터를 전달 시 용량, 길이에 제한이 있다. 
				 만약에 데이터가 전달 될 시 주소창에 스트링으로 붙여서 전송된다. 
				 보안상 우려가 되는 데이터는 get 방식을 사용하면 안 된다. 
				 
				 doGet()
				 
		2) post : (post office)
				  서버 측 프로그램에 데이터 전달이 주 목적이다.
				  내가 ~~~한 데이터를 전달할테니 이 데이터를 처리한 결과를 다시 보내줘~ 할 때 사용 
				  따라서 많은 양의 데이터거나 보안 상, 노출되면 안 되는 경우 반드시 post를 사용. 
				  <-> get. 데이터의 길이, 용량에 제한이 없다.  
				  
				  doPost()
	 -->
	<form action="LFS" method ="post">
		ID : <input type ="text" name = "id"><br><br>
		PW : <input type = "password" name = "password"><br><br>
		<input type = "submit" value="LOGIN">
	</form>
	<p></p>
    <hr>
    <p></p>
    <form action="LFS" method ="get">
		ID : <input type ="text" name = "id"><br><br>
		PW : <input type = "password" name = "password"><br><br>
		<input type = "submit" value="LOGIN">
	</form>
    <ul>
        <li><a href="index.html">INDEX PAGE</a></li>
    </ul>
</div>
</body>
</html>
