<!DOCTYPE html>
<!-- 
정적인 문서 작성-> 요청-> 응답에 이르기까지 순서 
1. 개발자가 .html 파일을 작성한다. 
2. 서버 가동
3. 작성된 파일이 들어있는 프로젝트단위를 직접 서버 안으로 배포한다. 
	Tomcat 서버를 모든 코드가 배포되는 최상위 디렉토리인 webapps 안에 프로젝트 단위로 저장
4. 요청을 진행 
	브라우저로 요청
	http://서버가 설치되어 있는 ip:포트(톰캣은80)/프로젝트명=> Context or Context Path/.html파일
	=> http://서버가 설치되어 있는 ip:8888/context_path/.html파일
	
::
2~4번까지의 모든 작업을 이클립스가 대신 서비스 해준다. 
-->

<html>
<head>
<meta charset="EUC-KR">
<title>Insert title here</title>
</head>
<body bgcolor='yellow'>
	<h1>Hello HTML~~~!!</h1>
</body>
</html>
