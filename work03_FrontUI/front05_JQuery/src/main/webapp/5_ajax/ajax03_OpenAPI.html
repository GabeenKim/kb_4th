<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>

</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 부트스트랩이 자동으로 기입해준 JQuery CDN 따라서 별도로 작성해선 안 됨.  -->

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(function() {
	$('#send').click(function () {
		$.ajax({
			
			type : "get",
			url : "http://localhost:8888/weather.xml",
			dataType : 'xml',   //요청에다가 작성했지만 응답해서 가져오는 데이터 타입이 뭔지 정하는 것. 안해줘도 이상이 있는 것은 아님. 해주면 직관성이 높아짐. 
			
			success : function (result) {
				//alert(result);
				var str ="";
				//find로 list를 찾을 때마다 반복
				$(result).find('list').each(function(index, item) {
					var region = $(this).find('region').text(); // html도 가능하나 데이터만 가져올 때는 text
					var wind = $(this).find('wind').text();
					var rain = $(this).find('rain').text();
					var temp = $(this).find('temp').text();
					
					str += "<tr>";
					str += "<td>"+region+"</td>";
					str += "<td>"+wind+"</td>";
					str += "<td>"+rain+"</td>";
					str += "<td>"+temp+"</td>";
					str += "</tr>";
				})//each
				
				//str을 tbody 부분에 부탁하며 됨. 태그에 내용을 부착 ...append()사용
				$('tbody tr').remove();
				$('tbody').append(str);
			},//callback
			
		});
	});//click
});
</script>
</head>


<body>
<div class="jumbotron text-center" >
	<h2>=========== OPEN API : weather데이터 가져오기  ===========</h2>
	<p><a href="#" id="send">XML 데이터 서버로 요청하기</a></p>
</div>
<div class= "container pt-3" > 
	<table class="table table-striped">
		<thead>
			<tr>
				<th>REGION</th>
				<th>WIND</th>
				<th>RAIN</th>
				<th>TEMP</th>
			</tr>
		</thead>
		<tbody>
			<!-- 이 부분에 공공데이터 XML 내용이 출력됨 -->
			
		</tbody>
	</table>
</div>

</body>
</html>
