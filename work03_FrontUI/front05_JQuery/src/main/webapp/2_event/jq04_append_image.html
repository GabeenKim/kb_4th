<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	.angel{border:2px solid black; width:200px; height:250px;}
	
</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
	$(function(){  
		//class 속성의 이름을 값으로 지정 addClass
		$('img').addClass('angel');
		
		//2초 간격으로 작업이 진행되도록 
		/* setInterval(function() {
			//특정한 시간이 지난 뒤, 첫번째 이미지가 body 뒤에 갈수 있도록 즉,append 작성 
			$('body').append($('img:eq(0)'));
		}, 2000); */
		
		/* setInterval(() => {
		//특정한 시간이 지난 뒤, 첫번째 이미지가 body 뒤에 갈수 있도록 즉,append 작성 
			$('body').append($('img:eq(0)'));
		}, 2000); */
		
		/* setInterval(() => {
			$('img:eq(0)').append('body');
		}, 2000); */ 
		/*
			부착과 관련된 함수는 반드시 태그 뒤에 내용을 부착해야 한다. 
			내용 뒤에 태그를 부착해서는 안 된다. 
			내용 뒤에 태그를 부착하고 싶을 때는 appendTo를 사용해야 한다.
		*/
		setInterval(() => {
			$('img:eq(0)').appendTo('body');
		}, 2000);
	});
</script>
</head>
<body>

	<img src="../image/1.jpg">
	<img src="../image/2.jpg">
	<img src="../image/3.jpg">
	<img src="../image/4.jpg">
	
</body>
</html>
