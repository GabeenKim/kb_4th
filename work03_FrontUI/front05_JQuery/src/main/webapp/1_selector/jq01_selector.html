<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>

</style>
<!-- 구글에서 제공하는 JQuery의 라이브러리. libs : compressed된 라이브러리 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
	//$ == JQuery와 같은 키워드
	$(function(){  
		//1. 버튼 클릭 시 함수 호출... click()
		//jquery에서 선택자를 선택할 때는 $(' ')안에 작성해야함. # or . or 태그명
		$('button').click(function () {
			//h2,p 영역의 글씨색깔을 purple로 지정 (color:purple)
			$('h2,p').css('color','purple');
		});
		
		//h2태그의 자식 태그인 span을 선택자로 지정하고 글자색을 red로 
		$('h2>span').css('color','red');
		//자식 표현
		/* 
			h2 span :자손
			h2>span :직계 자식 
		*/
		
		//동일한 태그가 여러 개일 때 그 중에서 제일 처음 태그를 지정. 경계선을 1px solid green
		/* $('p:first').css('border','1px solid green'); */
		/* $('p').first().css('border','1px solid green'); */
		/* $('p').last().css('border','1px solid green'); */ //first와 last second이런건 X
		$('p:eq(0)').css('border','1px solid green');   //따라서 :eq(idx)를 사용하는게 좋음. 
		
		//p태그의 클래스 속성의 값이 theme인 것 지정 
		$('p.theme').css('border','1px solid red')
	}); 
	
	//onload 함수와 동일한 기능. 
	//onload는 무조건 1번만 사용 가능한데, $function은 필요하다면 여러번 정의 가능.  
	$(function(){  
		
	});
</script>
</head>
<body>
	<h2 id="header">	
		<span>This is a heading</span>
	</h2>
	
	<p>This is a paragraph.</p>
	<p class="content">This is another paragraph1.</p>
	<p class="content theme">This is another paragraph2.</p>
	
	<button>Click me to hide paragraphs</button>
</body>
</html>
