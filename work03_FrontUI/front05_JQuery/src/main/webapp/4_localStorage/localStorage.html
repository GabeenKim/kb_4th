<!-- 
	local storage에 데이터 저장/ 삭제 / 가져오는 방법 
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
	$(function() {
		$('#saveBtn').click(function() {
			//localStorage에 데이터 map 방식으로 저장
			localStorage.setItem("key1" ,"안녕");
			localStorage.key2 = "hi";
			localStorage["key3"] = "hello";
		});
		
		$('#delBtn').click(function() {
			//내가 원하는 데이터를 삭제하는 방법 
			localStorage.removeItem("key1");
			
		});
		
		$('#delAllBtn').click(function() {
			//모든 데이터를 삭제
			localStorage.clear();
		});
		
		$('#showBtn').click(function() {
			localStorage.getItem("key1")+", "
			+localStorage.key2+", "
			+localStorage.getItem["key3"];
			
		});
		
	}); //ready
</script>
</head>
<body>
	<button id = "saveBtn">저장</button>
	<button id = "delBtn">삭제</button>
	<button id = "delAllBtn">전체 삭제</button>
	<button id = "showBtn">내용 보기</button>
</body>
</html>
