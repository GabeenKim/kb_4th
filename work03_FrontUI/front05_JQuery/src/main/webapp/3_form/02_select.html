<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">

</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(function() {
	//1.버튼 클릭하면 resultView영역에다가 출력...버튼의 타이틀을 출력 
	$('#createBtn').click(function () {
		var title = $(this).val();
		/* $('#resultView').append(title+'<br>'); */
		
		//2.html을 이용해서 위 append와 동일한 결과가 나오도록...
		var loca = $('#resultView').html();
		$('#resultView').html(title+"<br>"+loca);
	})
	
	$('#createSel').change(function () {
		var theater = $(this).val();
		//alert(th);
		var loca = $('#resultView').html();
		$('#resultView').html(loca+theater+"<br>");
	})
	

});
</script>
</head>
<body>
<input type="button" value="버튼 클릭시 동적으로 문자열 생성" id="createBtn">
<select id="createSel">
	<option>국민은행 선릉지점</option>
	<option>국민은행 강남지점</option>
	<option>국민은행 강북산단지점</option>
	<option>국민은행 가산지점</option>
	<option>국민은행 서초지점</option>
</select>

<div id="resultView"></div>
</body>
</html>
