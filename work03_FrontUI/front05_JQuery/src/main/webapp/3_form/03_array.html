<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$(function() {
	$('#eachBtn').click(function () {
		var array=[];
		array.push("제니");
		array.push("기안");
		array.push("현무");
		array.push("나래");
		
		//alert(array);
		//alert(array.length);
		
		//2. for | JS에서는 forEach였는데 JQ는 each()
	/* 	var str = "";
		for(var i =0; i<array.length;i++){
			//alert(array[i]);
			str+=array[i]+" ";
		}
		alert(str); */
		
		//3. each()
		var str = "";
		$.each(array,function(index,item){
			str += item + " ";
		});
		alert(str);
	
	})
});
</script>
</head>
<body>
	<input type = "button" value = "배열에 each() 적용" id ="eachBtn">
</body>
</html>
