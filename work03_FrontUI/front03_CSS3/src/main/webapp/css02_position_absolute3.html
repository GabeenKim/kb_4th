<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
	body{
		background-color: #f9fafc;
		margin: 60px;
	}
	.red{
		background-color: #e46e80;
		width: 500px;
		height: 500px;
		
		position : relative;
	}
		
	.green{
		background-color: #32b9c1;
		width: 300px;
		height: 300px;	

	}
	
	/* 1. absolute는 포지셔닝된 가장 가까운 조상요소(그린)을 찾아서 그 위치를 기준으로 삼는다.  */
	/* 2. orange 요소도 원래 위치를 고수할 수 없다. */
		.blue{
		background-color: #5195ee;
		
		height: 100px;	
		position : absolute;
		bottom : 40px;
		
		left : 10px;
	}
	.orange{
		background-color: #f18575;
		
		height: 100px;
		
		
	}
	
	/* 블루, 오렌지 영역의 width를 제거하면 orange는 부모 영역 크기만큼 꽉 차지만
		블루는 사라진다. 왜냐하면 blue의 position이 absolute로 되면서 부모의 영역을 벗어났기 때문이다. 
		그러나 텍스트와 같은 영역이 있다면 이 때는 살아난다. 
	 */
</style>
</head>
<body>

<div class="red">
	<div class="green">
		<div class="blue">블루영역</div>
		<div class="orange"></div>
	</div>
</div>
</body>
</html>
