<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
h1::selection{
	background-color: black;
	color: yellow;
}
</style>
<script>
	//getElementById 대신에 querySelector로 작성하는 법. 
	function push(){ 
		document.querySelector('#demo').innerHTML = "<h2 style='color:crimson'> Hello getElementById~~!!</h2>"
		
	};

</script>

</head>
<body>

<h1>What Can JavaScript Do?</h1>
<p id="demo">JavaScript can change HTML content.</p>

<button type="button" onclick="push()">Click Me!</button>

</body>
</html>
