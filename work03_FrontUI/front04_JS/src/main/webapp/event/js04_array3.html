<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script >


	function choiceMenu(){
		let str= "";
		//같은 것이 여러개 있을 때 querySelectorAll을 사용해주면 배열이 리턴된다. 
		//향상된 for문 forEach(값, 인덱스) 
		document.querySelectorAll(".menu").forEach(function(item,index) {
			//alert(item.value);
			if(item.checked) str += item.value+" ";	
			
			item.checked = false;
		});//forEach 끝
		
		if(str=="") alert("하나의 메뉴는 선택해주세요");
		else alert("당신이 선택한 메뉴는 "+str+"입니다.");
	}
	onload = function(){
	document.querySelectorAll(".menus").forEach(function(item,index) {
		item.onclick = function(){
			//this : 현재 이벤트가 적용되고 있는 요소 자기 자신.
			let id = this.closest(".main-menu").attributes['id'].value;   
			//↑ this를 중심으로 가장 가까운 부모를 찾고/그것의 아이디를 찾고/그 값을 찾는다.
			alert(id);
		}
	});//forEach 끝
	}
</script>
</head>
<body>
<div class = "main-menu" id="lunch-menu">
	<form name="frm">
	    <strong>오늘 먹고 싶은 점심 메뉴를 다 고르세요...</strong><br><br>
	    
	    <!-- id는 유니크한 값 class는 여러개 가능. -->
	    <input type="checkbox" name="menu" value="된장찌개" class ="menu">된장찌개<br>
	    <input type="checkbox" name="menu" value="김치찌개" class ="menu">김치찌개<br>
	    <input type="checkbox" name="menu" value="카레라이스" class ="menu">카레라이스<br>
	    <input type="checkbox" name="menu" value="우동" class ="menu" >우동<br>
	    <input type="button" value="CHOICE" onclick="choiceMenu()">
	
	</form>
	<button class = "menus">Lunch Choice</button>
</div>

<div class = "main-menu" id="dinner">
	<form name="frm">
	    <strong>오늘 먹고 싶은 점심 메뉴를 다 고르세요...</strong><br><br>
	    
	    <!-- id는 유니크한 값 class는 여러개 가능. -->
	    <input type="checkbox" name="menu" value="된장찌개" class ="menu">된장찌개1<br>
	    <input type="checkbox" name="menu" value="김치찌개" class ="menu">김치찌개1<br>
	    <input type="checkbox" name="menu" value="카레라이스" class ="menu">카레라이스1<br>
	    <input type="checkbox" name="menu" value="우동" class ="menu" >우동1<br>
	    <input type="button" value="CHOICE" onclick="choiceMenu()">
	
	</form>
	<button class = "menus">Dinner Choice</button>
</div>
</body>
</html>
