<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script >
	function choiceMenu(){
		//값이 아니라 체크박스 form을 가져와서 변수 하나 만들어놓고 반드시 찍어볼 것. 확인!
		var menus = document.frm.menu;	
		
		var str ="";
		//alert(menus.length); -> array임을 확인 가능. 
		for(var i=0;i<menus.length;i++){
			//체크된 값 확인 -> .checked
			if(menus[i].checked){
				//값 가져오기 -> .value
					
				str +=menus[i].value+" ";
				
			}
			//for문 나오기 전에 선택한 체크표시들 해제해줘야 함. 
			menus[i].checked=false;
		}
		if(str=="") alert("하나의 메뉴는 선택해 주세요.")
		else{
			alert("당신이 선택한 메뉴들은 "+str+"입니다.");
			
		}
	}
	
	
</script>
</head>
<body>
<form name="frm">
    <strong>오늘 먹고 싶은 점심 메뉴를 다 고르세요...</strong><br><br>
    <input type="checkbox" name="menu" value="된장찌개">된장찌개<br>
    <input type="checkbox" name="menu" value="김치찌개">김치찌개<br>
    <input type="checkbox" name="menu" value="카레라이스">카레라이스<br>
    <input type="checkbox" name="menu" value="우동">우동<br>
    <input type="button" value="CHOICE" onclick="choiceMenu()">

</form>
</body>
</html>
