<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
var count =0;

onload = function(){
	setInterval(function() {
	let messages = [
		"안녕하세요",
		"Hello",
		"Bongjur~~~",		
	];
	
	let header = document.querySelector("h2");
	header.innerHTML = messages[count++];
	
	if(count == messages.length)count =0;
	
	},2000);  //안에 있는 데이터가 2초 간격으로 돌아감. 
}
</script>
</head>
<body>
<h1>National Greeting Message!!!</h1>
<h2 style="color:crimson">안녕하세요~~~</h2>

</body>
</html>
