<!-- 
	자바스크립트에서 onload함수가 필요한 이ㅠㅇ
	복합 연산자
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>

//1. 복합 연산자 사용
let list='';
list += '<ul>';
list += '<li>Hello</li>';
list += '<li>JavaScript~~</li>';
list += '</ul>';

//html 모든 요소들이 다 메모리에 올라가고 나서 실행 되도록 하는 기능. 
onload = function(){

	//2. document 안에 있는 특정한 요소에 출력이 되도록 
	document.getElementById('wrap').innerHTML = list;
	//document가 메모리에 올라가려면 .body까지 다 종료한 후에야 제대로 올라감.
	//1)따라서 밑에 내려서 쓰거나 
	//2) 내리지 않고 onload 함수를 사용한다. 

};
</script>


</head>
<body>
<h2 align="center">=======================on load ======================</h2>
<div id = "wrap">
<!-- 
	1. document 안에 있는 div 요소를 찾아서 
	2. 바로 거기에 내용을 출력한다. 
	3. 이 영역을 찾을 때 가장 많이 사용하는 기능이 
	- .getElementById('id명')
	- querySelector('#id명'or '.class명')
	- innerHTML
 -->
 
</div>
</body>

</html>
