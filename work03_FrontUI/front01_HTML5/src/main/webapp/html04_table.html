<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	h2 {
		text-align: center;
		color : crimson;
		
	}
	table{
		margin : 0 auto;
	}

	table, th, tr, td {
		border : 1px solid black;
		border-collapse: collapse;
	}
	p{
		text-align: center;	
	}
	td{
		text-align: center;
	}
	th{
		color : tomato;
	}
	
	tr:nth-child(even){
		background-color: #dddddd;
	}
	/*> : 직계자손}*/
	table>tbody>tr:HOVER{
		background-color:pink;
		
	}
</style>

</head>
<body>
	<h2>A basic HTML table</h2>

	<table >
	<thead>
		<tr>
    		<th>Company</th>
	    	<th>Contact</th>
	    	<th>Country</th>
	  </tr>
	</thead>
	
	<tbody>
	<tr>
	    <td>Alfreds Futterkiste</td>
	    <td>Maria Anders</td>
	    <td>Germany</td>
	  </tr>
	  <tr>
	    <td>Centro comercial Moctezuma</td>
	    <td>Francisco Chang</td>
	    <td>Mexico</td>
	  </tr>
	  <tr>
	    <td>Centro comercial Moctezuma1</td>
	    <td>Francisco Chang1</td>
	    <td>Mexico1</td>
	  </tr>
	</tbody>

	<tfoot>
		<tr>
			<td colspan= "3">To understand the example better ...</td>
		</tr>
	</tfoot>
	</table>
	
		
	
	
</body>
</html>
