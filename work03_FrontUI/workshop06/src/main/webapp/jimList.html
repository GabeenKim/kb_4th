<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" type="text/css" href="css/basic.css"/>
<style type="text/css">
	.poster{
	 width: 150px;
	 height : 150px;
	}
</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(function() {
	//html 파일이 로드되면 이게 먼저 실행 되고
	refreshPage();
	//삭제 버튼을 클릭하면 로컬 스토리지 삭제 기능으로 가서 삭제하ㅕㄴ 
	$('#content').on('click','#deleteCart',deleteLocalStorage);
});

	//얘를 호출하고
	function refreshPage() {
		var totalPrice = 0;
		var html ="";
		//로컬 스토리지에 있는 내용을 가져와서 테이블 안으로 출력. 
		for(var key in localStorage){
			//alert(key);
			if(key == 'length') break;
			var data = localStorage.getItem(key).split(",");
			html+= '<tr><td><img class =poster src ='+data[1]+'></td><td>'+key+
					'</td><td>'+data[0]+'</td><td>'+data[2]+
					'</td><td><button id = deleteCart value='+key+'>삭제</button></td></tr>';
			totalPrice += parseInt(data[2]);
		}//for
		
		//위 html 내용을 tbody에 붙여야 함. 
		$('#content').html(html);
		$('#price').html("총 주문 가격: "+totalPrice);
		
	}


function deleteLocalStorage(){
	var flag = confirm ($(this).val()+"번을 삭제하겠습니까?")
	if(flag == true) {
		localStorage.removeItem($(this).val());
		refreshPage();
	}
	
	
}
</script>
</head>
<body>
<article class="main">
		<section>
			<table width="80%"  align="center"  >
			<caption class="caption">찜 리스트</caption>
			<thead>
				<tr><th>이미지</th><th>상품번호</th><th>상품이름</th><th>가격</th><th>삭제</th></tr>
			</thead>
			<tbody id="content">
			</tbody>
			</table>
		</section>
		<section  class="toalprice" id="price">
			
		</section>
		<section class="link">
			<table   align="center">
			<tr><td align="center">
				<a href="">주문하러 가기</a> 
				<a href="index.html">DVD 목록</a> 
			</td></tr>
			</table>
		</section>
		</article>
</body>
</html>
